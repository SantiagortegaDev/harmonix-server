# ============================================================
# Workflow: Deploy al VPS vía SSH
#
# Cuando haces push a `main`, este workflow:
#   1. Hace SSH al VPS por Cloudflare Tunnel (o IP directa)
#   2. Hace git pull en ~/pi-stream-repo
#   3. Reinstala deps y rebuild Next.js
#   4. Reinicia el servicio systemd
#
# REQUIERE secrets:
#   VPS_HOST     — hostname del VPS (ej: app.tudominio.com)
#   VPS_USER     — usuario SSH
#   VPS_SSH_KEY  — private key SSH
#   VPS_SSH_PORT — puerto (default: 22)
# ============================================================

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'components.json'
      - 'deploy/setup-vps.sh'
      - 'install.sh'
  workflow_dispatch:

jobs:
  deploy-vps:
    name: Deploy frontend to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/key -p ${{ secrets.VPS_SSH_PORT || 22 }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -euo pipefail
            cd ~/pi-stream-repo 2>/dev/null || {
              echo "Repo no clonado, clonando…"
              git clone https://github.com/SantiagortegaDev/harmonix-server ~/pi-stream-repo
              cd ~/pi-stream-repo
            }
            git fetch --all
            git reset --hard origin/main
            # Instalar deps si cambiaron
            bun install --frozen-lockfile 2>/dev/null || bun install
            # Rebuild
            bun run build
            # Reiniciar
            sudo systemctl restart pi-stream-frontend
            sleep 3
            sudo systemctl is-active --quiet pi-stream-frontend && echo "✓ frontend restarted OK" || {
              echo "✗ frontend failed to start"
              sudo journalctl -u pi-stream-frontend -n 20 --no-pager
              exit 1
            }
          EOF

      - name: Health check
        run: |
          sleep 5
          curl -fsSI https://app.${{ secrets.MAIN_DOMAIN }}/ | head -1 || \
            curl -fsSI http://${{ secrets.VPS_HOST }}/ | head -1
